<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성원토월 일정표 - 귀여운 고양이와 함께</title>
    <style>
        /* CSS 스타일 */
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            overflow-x: hidden; /* 애니메이션 중 스크롤 방지 */
        }

        #main-container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative; /* 고양이 애니메이션 기준점 */
            padding-top: 120px; /* 고양이가 들어올 공간 마련 */
        }

        h1 {
            color: #333;
            text-align: center;
        }

        /* 고양이 애니메이션 컨테이너 */
        #cat-container {
            position: absolute;
            top: 10px;
            right: -250px; /* 초기 위치: 화면 오른쪽 밖 */
            width: 200px;
            height: 200px;
            animation: walk-in 3s forwards; /* 3초 동안 걸어들어오기 */
        }

        #cat-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 걸어 들어오는 애니메이션 */
        @keyframes walk-in {
            0% {
                right: -250px; /* 화면 밖 */
            }
            100% {
                right: 20px; /* 컨테이너 내부 적절한 위치로 이동 */
            }
        }

        /* 손 흔드는 애니메이션 (걸어 들어온 후 실행) */
        .wave-hand {
            animation: wave 1s ease-in-out 3; /* 1초 동안 3번 흔들기 */
            transform-origin: top right; /* 손 흔드는 기준점 (오른쪽 귀/손 부근) */
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(20deg); }
            75% { transform: rotate(-20deg); }
        }
        
        /* 일정표 스타일 예시 */
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .schedule-table th, .schedule-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        .schedule-table th {
            background-color: #f2f2f2;
        }

    </style>
</head>
<body>

    <div id="main-container">
        <!-- 고양이 애니메이션 영역 -->
        <div id="cat-container" onclick="waveHello()">
            <!-- 고양이 이미지 (제공된 이미지의 외부 링크 사용) -->
            <img src="https://replicate.delivery/xpbkg/4m8M6Xz3w7Z8907Q4lq6q0y955R4N9e9O6R8s8u9R4R8u9R8/output.png" alt="귀여운 고양이">
        </div>

        <h1>성원토월 32평 인테리어 일정표</h1>
        
        <table class="schedule-table">
            <thead>
                <tr>
                    <th>날짜</th>
                    <th>공정</th>
                    <th>내용</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>월 1일</td>
                    <td>철거</td>
                    <td>기존 가구 및 마감재 철거</td>
                </tr>
                <tr>
                    <td>월 3일</td>
                    <td>설비/전기</td>
                    <td>배관 및 배선 작업</td>
                </tr>
                <!-- 일정 내용은 여기에 추가하세요 -->
            </tbody>
        </table>
        <p>일정표는 계속 업데이트됩니다. 수정을 원하시면 저에게 말씀해 주세요!</p>
    </div>

    <script>
        // JavaScript 동작
        // 페이지가 로드된 후 실행
        window.onload = function() {
            const catContainer = document.getElementById('cat-container');
            
            // 걸어 들어오는 애니메이션이 끝난 후(3초 뒤) 손 흔들기 시작
            setTimeout(function() {
                catContainer.querySelector('img').classList.add('wave-hand');
            }, 3000);
        };

        // 고양이를 클릭했을 때도 손을 흔드는 기능
        function waveHello() {
            const catImg = document.getElementById('cat-container').querySelector('img');
            catImg.classList.remove('wave-hand'); // 기존 애니메이션 초기화
            void catImg.offsetWidth; // 애니메이션 재시작을 위한 강제 리플로우
            catImg.classList.add('wave-hand');
        }
    </script>

</body>
</html>
